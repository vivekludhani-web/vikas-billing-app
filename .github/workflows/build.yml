name: Build APK
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 11
      uses: actions/setup-java@v5
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: gradle
    - name: Download gradle-wrapper.jar if missing
      run: |
        mkdir -p gradle/wrapper
        wget --quiet "https://github.com/gradle/gradle/releases/download/v8.5.0/gradle-8.5.0-bin.zip" -O /tmp/gradle.zip
        unzip -q /tmp/gradle.zip "gradle-8.5.0/gradle/wrapper/gradle-wrapper.jar" -d /tmp/
        cp /tmp/gradle-8.5.0/gradle/wrapper/gradle-wrapper.jar gradle/wrapper/
        rm -rf /tmp/gradle* 
    - name: Make gradlew executable
      run: chmod +x ./gradlew
    - name: Build Debug APK
      run: ./gradlew assembleDebug
    - name: Upload APK to Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: APK-Artifacts
        path: app/build/outputs/apk/debug/app-debug.apk
